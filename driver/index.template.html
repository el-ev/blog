<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <title>{{TITLE}}</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --page-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .page {
            max-width: 100%;
            width: 100%;
            height: auto;
            background: var(--page-bg);
            box-shadow: 0 4px 12px var(--shadow-color);
            display: block;
        }

        #raw-copy-toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            font-family: Consolas, "Courier New", monospace;
            transform: translateX(-50%);
            font-size: 13px;
            line-height: 1;
            padding: 9px 12px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            color: #222;
            background: #eee;
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
            z-index: 9999;
        }
    </style>
</head>

<body>
<main>
{{TEXT}}
{{RAW_COPY}}
{{PAGES}}
</main>
<script src="{{CLIPBOARD_SRC}}"></script>
</body>

</html>
